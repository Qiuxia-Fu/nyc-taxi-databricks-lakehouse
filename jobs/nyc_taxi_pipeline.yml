resources:
  jobs:
    nyc_taxi_pipeline_git:
      name: nyc_taxi_pipeline_git
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: 02_bronze
            source: GIT
          environment_key: Default
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: 03_silver
            source: GIT
          environment_key: Default
        - task_key: apply_changes
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: 03c_apply_changes
            source: GIT
          environment_key: Default
        - task_key: gold
          depends_on:
            - task_key: apply_changes
          notebook_task:
            notebook_path: 04_gold
            source: GIT
          environment_key: Default
      git_source:
        git_url: https://github.com/Qiuxia-Fu/nyc-taxi-databricks-lakehouse
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
